name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python project
        uses: ./.github/actions/setup-python
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run linting
        run: uv run ruff check .
      - name: Run security linting
        run: uv run bandit -r src

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python project
        uses: ./.github/actions/setup-python
      - name: Audit Python dependencies
        run: uv run pip-audit

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python project
        uses: ./.github/actions/setup-python
      - name: Run tests
        run: uv run pytest
      - name: Render dashboard preview
        run: uv run novachrono preview
      - name: Verify dashboard preview
        shell: python
        run: |
          from pathlib import Path

          preview = Path("output/dashboard-preview.png")
          if not preview.is_file():
              raise SystemExit(
                  f"Dashboard preview was not created: {preview}"
              )
          print(f"Dashboard preview exists: {preview}")
