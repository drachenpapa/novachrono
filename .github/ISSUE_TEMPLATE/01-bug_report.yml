name: Bug report
description: Report a reproducible problem with Novachrono
title: "[BUG] "
labels:

* bug
  assignees:
* drachenpapa

body:

* type: markdown
  attributes:
  value: |
  Thanks for taking the time to report a problem.

  ```
  Before submitting logs or configuration, remove access tokens,
  private calendar URLs, device tokens, and other sensitive information.
  ```

* type: textarea
  id: description
  attributes:
  label: Describe the bug
  description: Clearly describe the problem you encountered.
  validations:
  required: true

* type: textarea
  id: reproduction
  attributes:
  label: Steps to reproduce
  description: List the smallest reliable sequence that reproduces the problem.
  placeholder: |
  1. Start Novachrono with ...
  2. Enable the ... widget
  3. Wait for ...
  4. Observe ...
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected behavior
  description: Describe what you expected to happen.
  validations:
  required: true

* type: textarea
  id: actual
  attributes:
  label: Actual behavior
  description: Describe what happened instead.
  validations:
  required: true

* type: dropdown
  id: affected-area
  attributes:
  label: Affected area
  options:
  - Local preview
  - Clock widget
  - Weather widget
  - Pokémon GO widget
  - GitHub widget
  - Times Gate communication
  - Configuration
  - Scheduling
  - Installation or deployment
  - Other
  validations:
  required: true

* type: dropdown
  id: deployment
  attributes:
  label: Deployment
  options:
  - Local development
  - Raspberry Pi
  - Docker
  - Other
  validations:
  required: true

* type: input
  id: version
  attributes:
  label: Novachrono version
  description: Use a release version or commit hash.
  placeholder: "e.g. 0.1.0 or a1b2c3d"

* type: input
  id: python-version
  attributes:
  label: Python version
  placeholder: "e.g. Python 3.13.5"

* type: input
  id: os
  attributes:
  label: Operating system
  placeholder: "e.g. Raspberry Pi OS, Ubuntu 24.04, Windows 11 or macOS"

* type: input
  id: firmware
  attributes:
  label: Times Gate firmware
  description: Only required when the physical device is affected.
  placeholder: "e.g. firmware version shown in the Divoom app"

* type: textarea
  id: logs
  attributes:
  label: Relevant logs
  description: |
  Paste relevant logs here. Remove tokens, credentials, private URLs,
  account information, and other sensitive values.
  render: shell

* type: textarea
  id: screenshots
  attributes:
  label: Screenshots or previews
  description: Add screenshots or generated preview images if they help explain the problem.

* type: textarea
  id: additional
  attributes:
  label: Additional context
  description: Add any other relevant context.
