name: Bug report
description: Report a reproducible problem with Novachrono
title: "[BUG] "
labels:
  - bug
assignees:
  - drachenpapa

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Before submitting logs or configuration, remove access tokens,
        private URLs, device tokens, credentials, and other sensitive information.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clearly describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Novachrono with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - Local preview
        - Clock widget
        - Weather widget
        - Pokémon GO widget
        - External data source
        - Times Gate communication
        - Configuration
        - Installation or deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows
        - Linux
        - Raspberry Pi OS
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Novachrono version
      description: Use a release version or commit hash.
      placeholder: "e.g. 0.1.0 or a1b2c3d"

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. Python 3.14.7"

  - type: input
    id: firmware
    attributes:
      label: Times Gate firmware
      description: Only required when the physical device is affected.
      placeholder: "e.g. firmware version shown in the Divoom app"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste relevant logs here. Remove tokens, credentials, private URLs,
        account information, and other sensitive values.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or previews
      description: Add screenshots or generated preview images if they help explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other relevant context.
